name: Daily flight deal snapshot

on:
  schedule:
    - cron: "0 * * * *"   # every hour, on the hour (UTC)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run snapshot and judge deals
        env:
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
        run: |
          set -o pipefail
          mkdir -p logs
          python scripts/snapshot.py | tee "logs/$(date -u +%F).md"

      - name: Back up DB as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flight-deals-db-${{ github.run_id }}
          path: data/flight_deals.db
          retention-days: 90
          if-no-files-found: warn

      - name: Commit snapshot data and log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/flight_deals.db logs/ deals.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Daily snapshot $(date -u +%F)"
            git push
          fi
