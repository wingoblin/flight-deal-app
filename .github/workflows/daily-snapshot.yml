name: Daily flight deal snapshot

on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 minutes (UTC)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run — skip snapshot/commit/mirror (no deals.json write/publish). Default ON for safety."
        type: boolean
        default: true
      diagnose_api:
        description: "One-off API diagnostic. Forces snapshot.py to run with DUMP_RAW_API=1 for GMP→CEB/KLO/FUK roundtrip. commit/mirror always skipped when ON. Use to see what Travelpayouts cache actually returns. Default OFF."
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-snapshot
  cancel-in-progress: false

# Schedule events have no inputs, so both resolve to '' → 'false'. Cron path
# behaves exactly as before. Manual dispatch defaults dry_run=true (safe).
env:
  DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
  DIAGNOSE_API: ${{ github.event.inputs.diagnose_api || 'false' }}

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browser (for local-mode verification)
        # Non-fatal: if the browser install fails, realtime.cheapest_krw falls
        # back to the serverless fetch mode, so the run still publishes.
        run: python -m playwright install --with-deps chromium || echo "playwright browser install failed; verification will use fallback mode"

      - name: Run snapshot and judge deals
        if: env.DRY_RUN != 'true' || env.DIAGNOSE_API == 'true'
        env:
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
          DUMP_RAW_API: ${{ env.DIAGNOSE_API == 'true' && '1' || '' }}
        run: |
          set -o pipefail
          mkdir -p logs
          python scripts/snapshot.py | tee "logs/$(date -u +%F).md"

      - name: Back up DB as artifact
        if: always() && env.DRY_RUN != 'true' && env.DIAGNOSE_API != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: flight-deals-db-${{ github.run_id }}
          path: data/flight_deals.db
          retention-days: 90
          if-no-files-found: warn

      - name: Commit snapshot data and log
        if: env.DRY_RUN != 'true' && env.DIAGNOSE_API != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/flight_deals.db logs/ deals.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Daily snapshot $(date -u +%F)"
            git push
          fi

      - name: Mirror deals.json to airpick-legal (public)
        if: env.DRY_RUN != 'true' && env.DIAGNOSE_API != 'true'
        env:
          AIRPICK_TOKEN: ${{ secrets.AIRPICK_DEPLOY_TOKEN }}
        run: |
          set -e
          DIR="${RUNNER_TEMP}/airpick-mirror"
          rm -rf "$DIR"
          git clone --depth 1 \
            "https://x-access-token:${AIRPICK_TOKEN}@github.com/wingoblin/airpick-legal.git" "$DIR"
          cp deals.json "$DIR/deals.json"
          cd "$DIR"
          if git diff --quiet -- deals.json; then
            echo "deals.json unchanged in airpick-legal; nothing to push"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add deals.json
          git commit -m "Update deals.json from flight-deal-app ($(date -u +%FT%TZ))"
          git push origin HEAD:main
