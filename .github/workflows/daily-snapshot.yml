name: Daily flight deal snapshot

on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 minutes (UTC)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run — skip snapshot/commit/mirror; run trigger.py read-only (no Expo / no INSERT / no PATCH / no DELETE). Default ON for safety."
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: daily-snapshot
  cancel-in-progress: false

# Schedule events have no inputs, so dry_run resolves to '' → 'false'. Cron path
# behaves exactly as before. Manual dispatch defaults dry_run=true (safe).
env:
  DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run snapshot and judge deals
        if: env.DRY_RUN != 'true'
        env:
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
        run: |
          set -o pipefail
          mkdir -p logs
          python scripts/snapshot.py | tee "logs/$(date -u +%F).md"

      - name: Evaluate triggers and send push notifications
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          TRIGGER_DRY_RUN: ${{ env.DRY_RUN == 'true' && '1' || '' }}
        run: |
          set -o pipefail
          if [ "$TRIGGER_DRY_RUN" = "1" ]; then
            echo "=== DRY RUN: using committed deals.json, no writes ==="
            python scripts/trigger.py
          else
            python scripts/trigger.py | tee -a "logs/$(date -u +%F).md"
          fi

      - name: Back up DB as artifact
        if: always() && env.DRY_RUN != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: flight-deals-db-${{ github.run_id }}
          path: data/flight_deals.db
          retention-days: 90
          if-no-files-found: warn

      - name: Commit snapshot data and log
        if: env.DRY_RUN != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/flight_deals.db logs/ deals.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Daily snapshot $(date -u +%F)"
            git push
          fi

      - name: Mirror deals.json to airpick-legal (public)
        if: env.DRY_RUN != 'true'
        env:
          AIRPICK_TOKEN: ${{ secrets.AIRPICK_DEPLOY_TOKEN }}
        run: |
          set -e
          DIR="${RUNNER_TEMP}/airpick-mirror"
          rm -rf "$DIR"
          git clone --depth 1 \
            "https://x-access-token:${AIRPICK_TOKEN}@github.com/wingoblin/airpick-legal.git" "$DIR"
          cp deals.json "$DIR/deals.json"
          cd "$DIR"
          if git diff --quiet -- deals.json; then
            echo "deals.json unchanged in airpick-legal; nothing to push"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add deals.json
          git commit -m "Update deals.json from flight-deal-app ($(date -u +%FT%TZ))"
          git push origin HEAD:main
