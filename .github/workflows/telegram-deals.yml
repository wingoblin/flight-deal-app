name: Telegram deal alerts

# Fires whenever the snapshot job updates deals.json. Independent of the
# website — as long as GitHub Actions runs, new hot deals get posted to the
# Telegram channel. Never posts the same deal twice within the dedupe window.
on:
  push:
    branches: [main]
    paths: ["deals.json"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run — build/render but do NOT send to Telegram."
        type: boolean
        default: true
      resend:
        description: "Ignore the 24h dedupe for this run (re-send even if already sent). For manual test posts."
        type: boolean
        default: false

permissions:
  contents: read

# Serialize runs so two overlapping snapshots can't double-post.
concurrency:
  group: telegram-deals
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Persist the "already sent" state across runs via cache (rolling key).
      - name: Restore sent-deal state
        uses: actions/cache@v4
        with:
          path: .telegram-state
          key: telegram-sent-${{ github.run_id }}
          restore-keys: |
            telegram-sent-

      - name: Install Playwright + Korean fonts
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk

      - name: Post new hot deals to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_STATE_FILE: .telegram-state/sent.json
          # A deal only pings if it's a genuine drop AND affordable: at least
          # this much off its own baseline, and at/under this KRW price. Gating
          # on discount (not just price) keeps out routes that are cheap anyway
          # but barely discounted. A big enough drop (≥35%) overrides the price
          # ceiling so long-haul half-off steals still get through.
          TELEGRAM_MIN_DISCOUNT: "25"
          TELEGRAM_MAX_PRICE: "500000"
          TELEGRAM_PRICE_OVERRIDE_DISCOUNT: "35"
          # Absolute-price lane. A round-trip at/under this alerts on price
          # alone, discount ignored. The discount gate above can never pass a
          # genuinely cheap fare: a route that is always cheap has no room to
          # drop 25% off its own baseline, so every sub-180k round-trip was
          # filtered out while 313,000원/947,000원 ones went through. Still
          # round-trip only — one-way fares are never alerted on.
          TELEGRAM_CHEAP_MAX_PRICE: "180000"
          TELEGRAM_MAX_CARDS: "6"
          # Manual "resend" dispatch drops the dedupe window to 0 for that run.
          TELEGRAM_WINDOW_HOURS: ${{ github.event.inputs.resend == 'true' && '0' || '24' }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: python scripts/telegram_notify.py
