name: Telegram deal alerts

# Fires whenever the snapshot job updates deals.json. Independent of the
# website — as long as GitHub Actions runs, new hot deals get posted to the
# Telegram channel. Never posts the same deal twice within the dedupe window.
on:
  push:
    branches: [main]
    paths: ["deals.json"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run — build/render but do NOT send to Telegram."
        type: boolean
        default: true

permissions:
  contents: read

# Serialize runs so two overlapping snapshots can't double-post.
concurrency:
  group: telegram-deals
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Persist the "already sent" state across runs via cache (rolling key).
      - name: Restore sent-deal state
        uses: actions/cache@v4
        with:
          path: .telegram-state
          key: telegram-sent-${{ github.run_id }}
          restore-keys: |
            telegram-sent-

      - name: Install Playwright + Korean fonts
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk

      - name: Post new hot deals to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_STATE_FILE: .telegram-state/sent.json
          # Only surface round-trips at/under this KRW price. Discount floor is
          # off — price is the gate — so nothing sends unless a genuinely cheap
          # round-trip shows up (keeps the channel from getting spammy).
          TELEGRAM_MIN_DISCOUNT: "0"
          TELEGRAM_MAX_PRICE: "250000"
          TELEGRAM_MAX_CARDS: "6"
          TELEGRAM_WINDOW_HOURS: "24"
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: python scripts/telegram_notify.py
